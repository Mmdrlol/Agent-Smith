[project]
name = "agent-smith"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "fire",
    "mcp[cli]>=1,<2",
    "docker",
    "openai",
    "pytest",
    "python-dotenv"
]

[project.scripts]
sandbox = "sandbox.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
	"sandbox",
	"llm",
	"agent_mbpp",
	"agent_swebench",
	"mcp_server"
]

py-modules = [
	"mcp_tools_mbpp",
	"mcp_tools_swebench"
]
